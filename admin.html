<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Dashboard</title>
<style>body{font-family:system-ui;background:#f5f7fb;color:#172033;margin:0}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 6px 22px #0001}input,button{padding:11px;border-radius:9px;border:1px solid #d5dbe7;font-size:15px}button{background:#315efb;color:#fff;border:0;font-weight:700;cursor:pointer}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #e5e7eb}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.hidden{display:none}</style></head><body><div class="wrap"><div class="card"><h1>📊 Teacher Dashboard</h1><input id="email" type="email" placeholder="Teacher email"><input id="password" type="password" placeholder="Password"><button id="login">Login</button> <button id="logout" class="hidden">Logout</button><span id="msg"></span></div><div id="dash" class="hidden"><div class="card"><button id="refresh">Refresh</button> <button id="csv">Export CSV</button></div><div id="out"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient("https://yamtbiyeztvfgguhjqvn.supabase.co","sb_publishable_-NMYdyCoF36FP9qVUae30Q_WxspaVoo");
const groups=[["G1","Heuristic Search"],["G2","Problems of Heuristic Techniques & Real-World Examples"],["G3","AND-OR Graphs"],["G4","A* Algorithm – Concept, Working & Properties"],["G5","A* Algorithm – Solved Problem & Applications"],["G6","AO* Algorithm"],["G7","A* vs AO*"],["G8","Problem Reduction"],["G9","Game Playing Search"],["G10","Minimax Algorithm"],["G11","Alpha-Beta Pruning"],["G12","Minimax vs Alpha-Beta + Case Study"],["G13","Best First Search and Depth Limit Search"]];let rows=[];
login.onclick=async()=>{let r=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(r.error)msg.textContent=r.error.message;else{dash.classList.remove("hidden");logout.classList.remove("hidden");load()}};
logout.onclick=async()=>{await sb.auth.signOut();dash.classList.add("hidden");logout.classList.add("hidden")};
async function load(){let r=await sb.from("evaluations").select("*").order("created_at",{ascending:false});if(r.error){msg.textContent=r.error.message;return}rows=r.data||[];let html='<div class="grid">';for(let g of groups){let a=rows.filter(x=>x.group_id===g[0]).map(x=>x.score),avg=a.length?(a.reduce((x,y)=>x+y,0)/a.length).toFixed(2):"—";html+=`<div class="card"><h2>${g[0]}</h2><b>${g[1]}</b><p>Average: <strong>${avg}/10</strong></p><p>Evaluations: ${a.length}</p></div>`}html+='</div><div class="card"><h2>All Evaluations</h2><table><tr><th>Roll</th><th>Group</th><th>Score</th><th>Time</th></tr>';for(let r of rows)html+=`<tr><td>${r.evaluator_roll}</td><td>${r.group_id}</td><td>${r.score}/10</td><td>${new Date(r.created_at).toLocaleString()}</td></tr>`;out.innerHTML=html+'</table></div>'}
refresh.onclick=load;csv.onclick=()=>{let c="Evaluator Roll,Group,Score,Timestamp\n"+rows.map(r=>`${r.evaluator_roll},${r.group_id},${r.score},${r.created_at}`).join("\n");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([c],{type:"text/csv"}));a.download="AI_Presentation_Evaluations.csv";a.click()};
</script></body></html>
